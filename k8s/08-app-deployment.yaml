apiVersion: apps/v1
kind: Deployment
metadata:
  name: whistle-app
  namespace: whistleblower
  labels:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: whistleblower
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whistleblower
        app.kubernetes.io/component: web
    spec:
      affinity:
        # NODE SPREAD / ANTI-AFFINITY: Distributes the 2 web pods across separate worker nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["web"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: web
          image: whistleblower-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: whistle-app-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DJANGO_SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@whistle-redis-svc:6379/1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: media-storage
              mountPath: /code/media
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: whistle-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whistle-app-svc
  namespace: whistleblower
  labels:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: web
