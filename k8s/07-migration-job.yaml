apiVersion: batch/v1
kind: Job
metadata:
  name: whistle-migration-job
  namespace: whistleblower
  labels:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whistleblower
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: whistleblower-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
          envFrom:
            - configMapRef:
                name: whistle-app-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DJANGO_SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@whistle-redis-svc:6379/1"
          volumeMounts:
            - name: media-storage
              mountPath: /code/media
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: whistle-media-pvc
