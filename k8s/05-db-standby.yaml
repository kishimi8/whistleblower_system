apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: whistle-db-standby
  namespace: whistleblower
  labels:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
spec:
  serviceName: whistle-db-standby-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whistleblower
      app.kubernetes.io/component: database
      app.kubernetes.io/role: standby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whistleblower
        app.kubernetes.io/component: database
        app.kubernetes.io/role: standby
    spec:
      affinity:
        # STRICT NODE ANTI-AFFINITY: Ensures Standby is NEVER scheduled on the same node as Primary
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: ["database"]
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: postgres-standby
          image: postgres:15-alpine
          command: ["/entrypoint-standby.sh"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: DB_PASSWORD
            - name: PRIMARY_HOST
              value: "whistle-db-primary-svc"
            - name: PRIMARY_PORT
              value: "5432"
            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: REPLICATION_USER
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whistle-secrets
                  key: REPLICATION_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-p", "5432"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-p", "5432"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: entrypoint
              mountPath: /entrypoint-standby.sh
              subPath: entrypoint-standby.sh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whistle-db-standby-pvc
        - name: entrypoint
          configMap:
            name: whistle-db-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: whistle-db-standby-svc
  namespace: whistleblower
  labels:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: whistleblower
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
