# ====================================================
# PostgreSQL 15 Primary Configuration (HA Setup)
# ====================================================

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 150

# Memory & Caching
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Write Ahead Log (WAL) for Streaming Replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1024MB
hot_standby = on
archive_mode = on
archive_command = '/bin/true'

# Query Tuning & Logging
logging_collector = on
log_destination = 'stderr'
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '
