apiVersion: v1
kind: Service
metadata:
  name: {{ include "whistleblower.fullname" . }}-app-svc
  labels:
    {{- include "whistleblower.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "whistleblower.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
