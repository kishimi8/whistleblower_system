{{- if .Values.database.standby.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "whistleblower.fullname" . }}-db-standby
  labels:
    {{- include "whistleblower.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
spec:
  serviceName: {{ include "whistleblower.fullname" . }}-db-standby-svc
  replicas: 1
  selector:
    matchLabels:
      {{- include "whistleblower.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
      app.kubernetes.io/role: standby
  template:
    metadata:
      labels:
        {{- include "whistleblower.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
        app.kubernetes.io/role: standby
    spec:
      affinity:
        # STRICT NODE ANTI-AFFINITY: Ensures Standby is NEVER scheduled on the same node as Primary
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: ["database"]
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: postgres-standby
          image: "{{ .Values.database.standby.image.repository }}:{{ .Values.database.standby.image.tag }}"
          command: ["/entrypoint-standby.sh"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "whistleblower.fullname" . }}-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "whistleblower.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: PRIMARY_HOST
              value: "{{ include "whistleblower.fullname" . }}-db-primary-svc"
            - name: PRIMARY_PORT
              value: "5432"
            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "whistleblower.fullname" . }}-secrets
                  key: REPLICATION_USER
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "whistleblower.fullname" . }}-secrets
                  key: REPLICATION_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data"
          resources:
            {{- toYaml .Values.database.standby.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-p", "5432"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-p", "5432"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: entrypoint
              mountPath: /entrypoint-standby.sh
              subPath: entrypoint-standby.sh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "whistleblower.fullname" . }}-db-standby-pvc
        - name: entrypoint
          configMap:
            name: {{ include "whistleblower.fullname" . }}-db-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whistleblower.fullname" . }}-db-standby-svc
  labels:
    {{- include "whistleblower.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "whistleblower.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app.kubernetes.io/role: standby
{{- end }}
