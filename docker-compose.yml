version: '3.8'

services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8059 --workers 3 --access-logfile - --error-logfile - --log-level info WhistleBlower.asgi:application -k uvicorn.workers.UvicornWorker --timeout 300"
    volumes:
      - .:/code
    ports:
      - "8059:8059"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-test-key-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_NAME=whistle
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=whistle
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

volumes:
  postgres_data:
